name: build-windows-exe

# Builds PixelMuse.exe on a real Windows runner, then *runs* the built
# artifact through tests/exe_smoke.py so we never publish an EXE that does
# not actually render images.
#
# Triggers:
#   * every push / PR          -> build + smoke test, upload as a workflow artifact
#   * a version tag (v1.2.3)   -> also attach the EXE to a GitHub Release
#   * manual run               -> same as a push

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and smoke-test the Windows EXE
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          # Build with the same minor version the target machine has.
          python-version: "3.10"
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pytest

      - name: Run the test suite before packaging
        run: python -m pytest tests -q

      # ---------------------------------------------------------------- #
      # Console CLI build. This is the artifact CI can execute headlessly,
      # which is how we prove the packaged app really works.
      # ---------------------------------------------------------------- #
      - name: Build the console executable (single file)
        env:
          PIXELMUSE_ONEFILE: "1"
        run: python -m PyInstaller --clean --noconfirm packaging/pixelmuse_cli.spec

      - name: Smoke-test the console executable
        run: python tests/exe_smoke.py dist/PixelMuse-CLI.exe oil_painting,pencil_sketch,pixel_art,watercolour,noir

      # ---------------------------------------------------------------- #
      # The windowed GUI build. Cannot be scripted, but we still verify it
      # was produced and that the bundled modules are importable.
      # ---------------------------------------------------------------- #
      - name: Build the windowed GUI executable
        run: python -m PyInstaller --clean --noconfirm packaging/pixelmuse.spec

      - name: Verify the GUI executable was produced
        shell: pwsh
        run: |
          $exe = "dist/PixelMuse.exe"
          if (-not (Test-Path $exe)) { throw "PixelMuse.exe was not built" }
          $size = (Get-Item $exe).Length
          Write-Host "PixelMuse.exe size: $([math]::Round($size / 1MB, 1)) MB"
          if ($size -lt 5MB) { throw "PixelMuse.exe looks too small: $size bytes" }
          # Fail early if a hidden import is missing, instead of shipping a
          # broken EXE that crashes the moment a user opens it.
          & "dist/PixelMuse-CLI.exe" list | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "the packaged CLI cannot list styles" }

      - name: Collect release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist/PixelMuse.exe release/ -Force
          Copy-Item dist/PixelMuse-CLI.exe release/ -Force
          Copy-Item README.md release/ -Force
          Get-ChildItem release | Format-Table Name, Length

      - name: Upload the Windows executables
        uses: actions/upload-artifact@v4
        with:
          name: PixelMuse-windows-exe
          path: release/*
          if-no-files-found: error
          # The GUI EXE is ~35 MB, well under the 2 GB artifact limit.
          retention-days: 90

      # ---------------------------------------------------------------- #
      # Publishing: only for version tags, and only after the smoke tests.
      # ---------------------------------------------------------------- #
      - name: Attach the executables to a GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/PixelMuse.exe
            release/PixelMuse-CLI.exe
          generate_release_notes: true
          body: |
            ## PixelMuse ${{ github.ref_name }}

            Offline AI image generator for Windows. Download `PixelMuse.exe`,
            double-click it, and start creating - no installation, no Python,
            no internet connection required.

            * `PixelMuse.exe` - the desktop app (19 styles across painting and drawing families)
            * `PixelMuse-CLI.exe` - optional command line version for batch work

            These executables were built and smoke-tested on a clean
            `windows-latest` runner by GitHub Actions.
